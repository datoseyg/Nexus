    - { min: 0, max: 39, label: "Insuficiente", tone: danger }
    - { min: 40, max: 64, label: "Baja", tone: warning }
    - { min: 65, max: 84, label: "Media", tone: info }
    - { min: 85, max: 100, label: "Alta", tone: success }
  activeImplementations:
    - file: "apps/nexus-bi-app/lib/confidence.ts"
      role: "etiqueta un score ya calculado (label + tone)"
      status: "AS_IS / CONFIRMADA"
