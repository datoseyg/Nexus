    role: "calcula el confidence_score POR TAREA desde campos crudos (formula ponderada: 25pt start_time, 25pt duration_minutes, 15pt hora_termino, 15pt calendario_laboral, 10pt feriados, 10pt trazabilidad)"
    status: "LEGACY - no existe en supabase-migration, recuperado via 'git show 7e69d7c:src/lib/calculation-confidence.js' (branch cloud-smoke-test)"
    thresholdParity: "confirmada byte-identica con lib/confidence.ts (mismos 4 tiers, mismas etiquetas)"
  localRuntimeObserved:
